<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="neonTrail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFC1" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="100" height="100" rx="20" fill="#0A0A14" />
  
  <!-- First Rhombus (Phone Receiver) -->
  <polygon points="50,15 80,45 50,75 20,45" fill="none" stroke="url(#neonTrail)" stroke-width="4" filter="url(#glow)" />
  
  <!-- Second Overlapping Rhombus (PC Mirror) -->
  <polygon points="50,25 70,45 50,65 30,45" fill="url(#neonTrail)" opacity="0.3" />
  <polygon points="50,25 70,45 50,65 30,45" fill="none" stroke="#00FFC1" stroke-width="2" />
  
  <!-- Center speed pulse dot -->
  <circle cx="50" cy="45" r="4" fill="#00FFC1" />
  
  <!-- Bottom Signal Wave -->
  <path d="M35,85 Q50,78 65,85" fill="none" stroke="#00FFC1" stroke-width="2.5" stroke-linecap="round" />
</svg>
